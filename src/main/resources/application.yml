spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/portfolio
    username: portfolio_user
    password: portfolio_pass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      platform: postgresql

  mail:
    host: smtp.ionos.fr
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    to: ${MAIL_TO}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080